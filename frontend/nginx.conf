server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects stay relative: the container port differs from the public one.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;

    # Vite emits content-hashed filenames under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback; index.html must always be revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
